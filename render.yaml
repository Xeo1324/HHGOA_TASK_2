services:
  - type: web
    name: novaron-rag-service
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 8000
      - key: DENSE_RETRIEVER
        value: faiss
      - key: STT_PROVIDER
        value: sarvam
      - key: TTS_PROVIDER
        value: edge
      - key: LLM_PROVIDER
        value: gemini
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
