name: CI / Quality & Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Retrieval Quality Gate
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: extractive
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      DENSE_RETRIEVER: hashing

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov

    - name: Run Backend Pytest Suite
      run: |
        cd backend
        python -m pytest tests -v

    - name: Verify Ponytail Latency Gate (< 200 ms)
      run: |
        python backend/scripts/benchmark_ponytail.py

    - name: Verify MSMARCO-XI Quality Gate
      run: |
        python backend/scripts/verify_retrieval_quality.py

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend Bundle
      run: |
        cd frontend
        npm run build

  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for committed secret patterns
      run: |
        if git grep -E 'sk-[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]+' -- ':!.env.example' ':!*.jsonl' ':!*.json'; then
          echo "Possible secret detected in repository"
          exit 1
        fi
        echo "No secrets detected."
